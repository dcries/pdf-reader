  <!-- In-browser offline translation model (Xenova/opus-mt-es-en via transformers.js) -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    // Only use the remote model hub for the initial download; after that,
    // transformers.js caches the weights in the browser's Cache Storage,
    // so subsequent loads work with no network connection at all.
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    let translatorPromise = null;
    let progressListeners = [];

    // Exposed to the non-module React script below.
    // onProgress receives raw transformers.js progress events; the caller
    // is responsible for filtering/formatting them.
    window.getOfflineTranslator = (onProgress) => {
      if (onProgress) progressListeners.push(onProgress);
      if (!translatorPromise) {
        translatorPromise = pipeline('translation', 'Xenova/opus-mt-es-en', {
          progress_callback: (data) => {
            progressListeners.forEach((fn) => {
              try { fn(data); } catch (e) { /* listener errors shouldn't break loading */ }
            });
          }
        }).catch((err) => {
          // Reset so a later retry can try again instead of being stuck on a rejected promise
          translatorPromise = null;
          throw err;
        });
      }
      return translatorPromise;
    };
  </script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Create inline service worker
        const swCode = `
          self.addEventListener('install', (event) => {
            console.log('Service Worker installed');
            self.skipWaiting();
          });
          
          self.addEventListener('activate', (event) => {
            console.log('Service Worker activated');
            return self.clients.claim();
          });
          
          self.addEventListener('fetch', (event) => {
            // Let all requests pass through
            event.respondWith(fetch(event.request));
          });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl)
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>

    // IndexedDB helper functions
    const DB_NAME = 'PDFReaderDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'pdfFiles';

    const openDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    };

    const savePDFToCache = async (bookId, fileName, fileData, fileSize) => {
      try {
        const db = await openDB();
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        
        await store.put({
          id: bookId,
          fileName: fileName,
          fileData: fileData,
          fileSize: fileSize,
          cachedAt: new Date().toISOString()
        });
        
        return true;
      } catch (error) {
        console.error('Error saving PDF to cache:', error);
        return false;
      }
    };

    const getPDFFromCache = async (bookId) => {
      try {
        const db = await openDB();
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        
        return new Promise((resolve, reject) => {
          const request = store.get(bookId);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        console.error('Error getting PDF from cache:', error);
        return null;
      }
    };

    const deletePDFFromCache = async (bookId) => {
      try {
        const db = await openDB();
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        await store.delete(bookId);
        return true;
      } catch (error) {
        console.error('Error deleting PDF from cache:', error);
        return false;
      }

    // Copy to clipboard with iOS fallback
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      // Fallback for iOS Safari
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.focus();
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      return Promise.resolve();
    }

    // Copy button with visual confirmation
    function CopyGistButton({ gistId, darkMode }) {
      const [copied, setCopied] = React.useState(false);
      const handleCopy = () => {
        copyToClipboard(gistId).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }).catch(() => {
          alert('Could not copy automatically. Please long-press the ID above and copy it manually.');
        });
      };
      return (
        <button
          onClick={handleCopy}
          className={`w-full py-2 rounded-lg text-sm font-medium transition-colors ${
            copied
              ? 'bg-green-600 text-white'
              : 'bg-blue-600 text-white active:bg-blue-800'

        >

      );

    // Sync setup form component — manages its own busy/error state
    function SyncSetupForm({ darkMode, onCancel, onSetup, onConnect }) {
      const [mode, setMode] = React.useState('choose');
      const [token, setToken] = React.useState('');
      const [gistId, setGistId] = React.useState('');
      const [busy, setBusy] = React.useState(false);
      const [error, setError] = React.useState('');

      const inputClass = `w-full px-3 py-2 rounded-lg text-sm border mt-1 ${darkMode ? 'bg-gray-700 border-gray-600 text-gray-200 placeholder-gray-500' : 'bg-white border-gray-300 text-gray-800 placeholder-gray-400'}`;
      const inputStyle = {WebkitUserSelect:'auto', userSelect:'auto', WebkitAppearance:'none'};

      const handleSetup = async () => {
        setError('');
        setBusy(true);
        try {
          await onSetup(token.trim());
        } catch(e) {
          setError('Invalid token — double-check it and try again.');
        }
        setBusy(false);
      };

      const handleConnect = async () => {
        setError('');
        setBusy(true);
        try {
          const ok = await onConnect(token.trim(), gistId.trim());
          if (ok === false) setError('Could not connect — check both values and try again.');
        } catch(e) {
          setError('Could not connect — check both values and try again.');
        }
        setBusy(false);
      };

      if (mode === 'choose') return (
        <div className="space-y-2">
          <p className={`text-xs mb-3 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Is this your first device setting up sync?</p>
          <button onClick={() => { setError(''); setMode('first'); }} className="w-full py-2 px-4 bg-blue-600 text-white rounded-lg text-sm font-medium active:bg-blue-800">
            Yes — first time setup
          </button>
          <button onClick={() => { setError(''); setMode('second'); }} className={`w-full py-2 px-4 rounded-lg text-sm font-medium border ${darkMode ? 'border-gray-600 text-gray-300 active:bg-gray-700' : 'border-gray-300 text-gray-700 active:bg-gray-50'}`}>
            No — connect to existing sync
          </button>
          <button onClick={onCancel} className={`w-full text-xs underline mt-1 ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>Cancel</button>
        </div>
      );

      if (mode === 'first') return (
        <div>
          <p className={`text-xs mb-3 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
            Paste your GitHub Personal Access Token (with <strong>gist</strong> scope). The app will create a secret Gist automatically.
          </p>
          <label className={`text-xs font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>GitHub Token</label>
          <input type="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            value={token} onChange={e => setToken(e.target.value)}
            placeholder="ghp_xxxxxxxxxxxx" className={inputClass} style={inputStyle} />
          {error && <p className="text-xs text-red-500 mt-1">{error}</p>}
          <div className="flex gap-2 mt-3">
            <button onClick={() => setMode('choose')} className={`flex-1 py-2 rounded-lg text-sm border ${darkMode ? 'border-gray-600 text-gray-400' : 'border-gray-300 text-gray-600'}`}>Back</button>
            <button onClick={handleSetup} disabled={!token.trim() || busy}
              className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium active:bg-blue-800 disabled:opacity-50">
              {busy ? 'Creating…' : 'Create & Connect'}

          </div>
        </div>
      );

      if (mode === 'second') return (
        <div>
          <p className={`text-xs mb-3 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
            Enter your GitHub token and the Gist ID shown on your other device.
          </p>
          <label className={`text-xs font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>GitHub Token</label>
          <input type="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            value={token} onChange={e => setToken(e.target.value)}
            placeholder="ghp_xxxxxxxxxxxx" className={inputClass} style={inputStyle} />
          <label className={`text-xs font-medium mt-3 block ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Gist ID</label>
          <input type="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
            value={gistId} onChange={e => setGistId(e.target.value)}
            placeholder="e.g. a1b2c3d4e5f6..." className={inputClass} style={inputStyle} />
          {error && <p className="text-xs text-red-500 mt-1">{error}</p>}
          <div className="flex gap-2 mt-3">
            <button onClick={() => setMode('choose')} className={`flex-1 py-2 rounded-lg text-sm border ${darkMode ? 'border-gray-600 text-gray-400' : 'border-gray-300 text-gray-600'}`}>Back</button>
            <button onClick={handleConnect} disabled={!token.trim() || !gistId.trim() || busy}
              className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium active:bg-blue-800 disabled:opacity-50">
              {busy ? 'Connecting…' : 'Connect'}
            </button>
          </div>
        </div>
      );
    }

    function PDFBookReader() {
      const [pdfFile, setPdfFile] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);
      const [totalPages, setTotalPages] = useState(0);
      const [pageText, setPageText] = useState('');
      const [translation, setTranslation] = useState(null);
      const [sentenceTranslation, setSentenceTranslation] = useState(null); // null | 'loading' | string
      const [loading, setLoading] = useState(false);
      const [pageHeight, setPageHeight] = useState(0);
      const [jumpToPageInput, setJumpToPageInput] = useState('');
      const [chapters, setChapters] = useState([]);
      const [detectingChapters, setDetectingChapters] = useState(false);
      const [selectedChapter, setSelectedChapter] = useState('');
      const [currentBookId, setCurrentBookId] = useState(null);
      const [savedBooks, setSavedBooks] = useState([]);
      const [showContinuePrompt, setShowContinuePrompt] = useState(false);
      const [savedPage, setSavedPage] = useState(null);
      const [darkMode, setDarkMode] = useState(false);
      const [headerCollapsed, setHeaderCollapsed] = useState(false);
      const [fontSize, setFontSize] = useState('medium');
      const [swipeProgress, setSwipeProgress] = useState(0);
      const [syncId, setSyncId] = useState(null);
      const [syncStatus, setSyncStatus] = useState('idle');
      const [showSyncSetup, setShowSyncSetup] = useState(false);
      const [cloudProgress, setCloudProgress] = useState(null);
      const [showCloudPrompt, setShowCloudPrompt] = useState(false);
      const [translatorStatus, setTranslatorStatus] = useState('idle'); // idle | loading | ready | error
      const [translatorProgress, setTranslatorProgress] = useState(0); // 0-100
      const translatorRef = useRef(null);
      const fileInputRef = useRef(null);
      const contentRef = useRef(null);
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);
      const touchStartY = useRef(0);
      const isSwiping = useRef(false);

      // Load saved books and dark mode preference on mount
      useEffect(() => {
        loadSavedBooks();
        const savedDarkMode = localStorage.getItem('pdfReaderDarkMode');
        if (savedDarkMode === 'true') {
          setDarkMode(true);
        }
        const savedHeaderState = localStorage.getItem('pdfReaderHeaderCollapsed');
        if (savedHeaderState === 'true') {
          setHeaderCollapsed(true);
        }
        const savedFontSize = localStorage.getItem('pdfReaderFontSize');
        if (savedFontSize) {
          setFontSize(savedFontSize);
        }
        const savedSyncId = localStorage.getItem('pdfReaderSyncId');
        if (savedSyncId) {
          setSyncId(savedSyncId);
        }
      }, []);

      // Save dark mode preference
      useEffect(() => {
        localStorage.setItem('pdfReaderDarkMode', darkMode.toString());
      }, [darkMode]);

      // Save header collapsed state
      useEffect(() => {
        localStorage.setItem('pdfReaderHeaderCollapsed', headerCollapsed.toString());
      }, [headerCollapsed]);

      // Save font size preference
      useEffect(() => {
        localStorage.setItem('pdfReaderFontSize', fontSize);
      }, [fontSize]);

      // Once a book is open, quietly start downloading/loading the offline
      // translation model in the background so it's ready by the time the
      // reader taps a word. Safe to call more than once - ensureTranslator
      // dedupes via translatorRef / the module-level promise.
      useEffect(() => {
        if (pdfFile) {
          ensureTranslator().catch(() => { /* surfaced via translatorStatus */ });
        }
      }, [pdfFile]);

      // Load saved books from localStorage
      const loadSavedBooks = () => {
        try {
          const saved = localStorage.getItem('pdfReaderBooks');
          if (saved) {
            setSavedBooks(JSON.parse(saved));
          }
        } catch (error) {
          console.error('Error loading saved books:', error);
        }
      };

      // Generate a unique ID for a book based on its content
      const generateBookId = (fileName, fileSize) => {
        return `${fileName}_${fileSize}`;
      };

      // Save reading progress
      const saveProgress = (bookId, page, fileName, fileSize, totalPages) => {
        try {
          const saved = localStorage.getItem('pdfReaderBooks');
          const books = saved ? JSON.parse(saved) : {};
          
          books[bookId] = {
            fileName,
            fileSize,
            currentPage: page,
            totalPages,
            lastRead: new Date().toISOString()
          };
          
          localStorage.setItem('pdfReaderBooks', JSON.stringify(books));
          setSavedBooks(books);
        } catch (error) {
          console.error('Error saving progress:', error);
        }
      };

      // Get saved progress for a book
      const getSavedProgress = (bookId) => {
        try {
          const saved = localStorage.getItem('pdfReaderBooks');
          if (saved) {
            const books = JSON.parse(saved);
            return books[bookId];
          }
        } catch (error) {
          console.error('Error getting saved progress:', error);
        }
        return null;
      };

      // ---- Cloud Sync via GitHub Gist ----
      const GIST_API = 'https://api.github.com/gists';
      const GIST_FILENAME = 'pdf-reader-progress.json';

      // Create a new secret Gist and return its ID
      const createGist = async (token) => {
        try {
          const res = await fetch(GIST_API, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              description: 'PDF Reader sync data',
              public: false,
              files: {
                [GIST_FILENAME]: { content: JSON.stringify({ progress: {} }) }
              }
            })
          });
          if (!res.ok) return null;
          const data = await res.json();
          return data.id || null;
        } catch (e) {
          console.error('Error creating Gist:', e);
          return null;
        }
      };

      // Push progress to the Gist
      const pushProgressToCloud = async (gistId, token, bookId, page, fileName, totalPages) => {
        if (!gistId || !token) return;
        try {
          // Read existing data first
          const getRes = await fetch(`${GIST_API}/${gistId}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
          });
          if (!getRes.ok) { setSyncStatus('error'); return; }
          const getData = await getRes.json();
          const raw = getData.files?.[GIST_FILENAME]?.content || '{"progress":{}}';
          const existing = JSON.parse(raw);
          existing.progress = existing.progress || {};
          existing.progress[bookId] = { page, fileName, totalPages, lastRead: new Date().toISOString() };

          await fetch(`${GIST_API}/${gistId}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              files: { [GIST_FILENAME]: { content: JSON.stringify(existing) } }
            })
          });
          setSyncStatus('synced');
        } catch (e) {
          console.error('Error pushing to Gist:', e);
          setSyncStatus('error');
        }
      };

      // Fetch progress for a book from the Gist
      const fetchCloudProgress = async (gistId, token, bookId) => {
        if (!gistId || !token) return null;
        try {
          const res = await fetch(`${GIST_API}/${gistId}`, {

                    className={`w-full flex items-center justify-between px-4 py-2.5 text-sm transition-colors ${
                      darkMode
                        ? 'text-gray-400 hover:text-gray-300 hover:bg-gray-700 active:bg-gray-600'
                        : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50 active:bg-gray-100'
                    }`}
                  >
                    <span>Translate sentence</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="9 18 15 12 9 6"/>
                    </svg>
                  </button>
                ) : sentenceTranslation === 'loading' ? (
                  // Loading state
                  <div className={`px-4 py-3 flex items-center gap-2 text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                    <div className={`animate-spin rounded-full h-3 w-3 border-b-2 ${darkMode ? 'border-blue-400' : 'border-blue-600'}`}></div>
                    Translating sentence…
                  </div>
                ) : (
                  // Sentence translation result
                  <div className="px-4 py-3">
                    <div className={`text-xs font-medium mb-1 flex items-center justify-between ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                      <span>Sentence</span>
                      <button
                        onClick={() => setSentenceTranslation(null)}
                        className={`text-xs underline ${darkMode ? 'text-gray-600' : 'text-gray-400'}`}
                      >hide</button>
                    </div>
                    <div className={`text-sm leading-relaxed ${darkMode ? 'text-blue-300' : 'text-blue-700'}`}>
                      {sentenceTranslation}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PDFBookReader />);
  </script>
</body>
</html>
