      if (w.endsWith('ieron')) add(w.slice(0, -5), ['er', 'ir']);
      if (w.endsWith('imos')) add(w.slice(0, -4), ['er', 'ir']);
      if (w.endsWith('iste')) add(w.slice(0, -4), ['er', 'ir']);
      if (w.endsWith('ió')) add(w.slice(0, -2), ['er', 'ir']);
      if (w.length > 2 && w.endsWith('í')) add(w.slice(0, -1), ['er', 'ir']);
      // Imperfect -ar
      if (w.endsWith('ábamos')) add(w.slice(0, -6), ['ar']);
      if (w.endsWith('abais')) add(w.slice(0, -5), ['ar']);
      if (w.endsWith('aban')) add(w.slice(0, -4), ['ar']);
      if (w.endsWith('abas')) add(w.slice(0, -4), ['ar']);
      if (w.endsWith('aba')) add(w.slice(0, -3), ['ar']);
      // Imperfect -er/-ir
      if (w.endsWith('íamos')) add(w.slice(0, -5), ['er', 'ir']);
      if (w.endsWith('íais')) add(w.slice(0, -4), ['er', 'ir']);
      if (w.endsWith('ían')) add(w.slice(0, -3), ['er', 'ir']);
      if (w.endsWith('ías')) add(w.slice(0, -3), ['er', 'ir']);
      if (w.endsWith('ía')) add(w.slice(0, -2), ['er', 'ir']);
      // Present tense - checked last: shortest/most ambiguous endings
      if (w.endsWith('emos')) add(w.slice(0, -4), ['er', 'ir']);
      if (w.endsWith('áis')) add(w.slice(0, -3), ['ar']);
      if (w.endsWith('éis')) add(w.slice(0, -3), ['er', 'ir']);
      if (w.length > 4 && w.endsWith('an')) add(w.slice(0, -2), ['ar']);
      if (w.length > 4 && w.endsWith('en')) add(w.slice(0, -2), ['er', 'ir']);
      if (w.length > 4 && w.endsWith('as')) add(w.slice(0, -2), ['ar']);
      if (w.length > 4 && w.endsWith('es')) add(w.slice(0, -2), ['er', 'ir']);

      return [...new Set(candidates)];
    };

    // Candidate root forms for plurals and masculine/feminine adjective pairs
    window.__morphologyCandidates = function(word) {
      const candidates = [];
      if (word.length > 4 && word.endsWith('es')) candidates.push(word.slice(0, -2));
      if (word.length > 3 && word.endsWith('s')) candidates.push(word.slice(0, -1));
      if (word.length > 3 && word.endsWith('a')) candidates.push(word.slice(0, -1) + 'o');
      return [...new Set(candidates)];
    };

    // Full dictionary lookup: exact match, then known irregular verb forms,
    // then plural/gender stripping, then regular-verb conjugation guesses.
    // Returns a string (with a "(root form)" note when it's an inferred
    // match rather than an exact one) or null if nothing matched.
    window.lookupSpanishDictionary = function(word) {
      const dict = window.__offlineDictionary;
      if (dict[word]) return dict[word];

      const irregularRoot = window.__irregularVerbForms[word];
      if (irregularRoot && dict[irregularRoot]) {
        return dict[irregularRoot] + ' (' + irregularRoot + ')';
      }

      for (const cand of window.__morphologyCandidates(word)) {
        if (dict[cand]) return dict[cand];
      }

      for (const cand of window.__conjugationCandidates(word)) {
        if (dict[cand]) return dict[cand] + ' (' + cand + ')';
      }

      return null;
    };
  </script>

  <!-- In-browser offline translation model (Xenova/opus-mt-es-en via transformers.js) -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    // Only use the remote model hub for the initial download; after that,
    // transformers.js caches the weights in the browser's Cache Storage,
    // so subsequent loads work with no network connection at all.
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    // Older devices (e.g. pre-2023 Safari, iPads with 2-4GB RAM) lack WASM
    // SIMD support. Without it, onnxruntime-web falls back to a much slower,
    // far more memory-hungry path that can get the tab killed by the OS
    // when loading/running even a small model. Detect support up front so
    // we can skip straight to the offline dictionary instead of crashing.
    function wasmSimdSupported() {
      try {
        return WebAssembly.validate(new Uint8Array([
          0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10,
          10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11,
        ]));
      } catch (e) {
        return false;
      }
    }
    window.__offlineTranslatorSupported = typeof WebAssembly !== 'undefined' && wasmSimdSupported();

    let translatorPromise = null;
    let progressListeners = [];

    // Exposed to the non-module React script below.
    // onProgress receives raw transformers.js progress events; the caller
    // is responsible for filtering/formatting them.
    window.getOfflineTranslator = (onProgress) => {
      if (!window.__offlineTranslatorSupported) {
        return Promise.reject(new Error('unsupported-device'));
      }
      if (onProgress) progressListeners.push(onProgress);
      if (!translatorPromise) {
        translatorPromise = pipeline('translation', 'Xenova/opus-mt-es-en', {
          progress_callback: (data) => {
            progressListeners.forEach((fn) => {
              try { fn(data); } catch (e) { /* listener errors shouldn't break loading */ }
            });
          }
        }).catch((err) => {
          // Reset so a later retry can try again instead of being stuck on a rejected promise
          translatorPromise = null;
          throw err;
        });
      }
      return translatorPromise;
    };
  </script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Create inline service worker
        const swCode = `
          self.addEventListener('install', (event) => {
            console.log('Service Worker installed');
            self.skipWaiting();
          });
          
          self.addEventListener('activate', (event) => {
            console.log('Service Worker activated');
            return self.clients.claim();
          });
          
          self.addEventListener('fetch', (event) => {
            // Let all requests pass through
            event.respondWith(fetch(event.request));
          });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl)
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    const DB_NAME = 'PDFReaderDB';

    const openDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    };

    const savePDFToCache = async (bookId, fileName, fileData, fileSize) => {
      try {
        const db = await openDB();
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        
        await store.put({
          id: bookId,
          fileName: fileName,
          fileData: fileData,
          fileSize: fileSize,
          cachedAt: new Date().toISOString()
        });
        
        return true;
      } catch (error) {
        console.error('Error saving PDF to cache:', error);
        return false;
      }

        return new Promise((resolve, reject) => {
          const request = store.get(bookId);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);

        console.error('Error getting PDF from cache:', error);

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {

      // Fallback for iOS Safari
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.opacity = '0';
      document.body.appendChild(el);
      el.focus();
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      return Promise.resolve();
    }

            setSavedBooks(JSON.parse(saved));
          }
        } catch (error) {
          console.error('Error loading saved books:', error);
        }
      };

      // Generate a unique ID for a book based on its content
      const generateBookId = (fileName, fileSize) => {
        return `${fileName}_${fileSize}`;
      };

      // Save reading progress
      const saveProgress = (bookId, page, fileName, fileSize, totalPages) => {
        try {
          const saved = localStorage.getItem('pdfReaderBooks');
          const books = saved ? JSON.parse(saved) : {};
          
          books[bookId] = {
            fileName,
            fileSize,
            currentPage: page,
            totalPages,
            lastRead: new Date().toISOString()
          };
          
          localStorage.setItem('pdfReaderBooks', JSON.stringify(books));
          setSavedBooks(books);
        } catch (error) {
          console.error('Error saving progress:', error);
        }
      };

      // Get saved progress for a book
      const getSavedProgress = (bookId) => {
        try {
          const saved = localStorage.getItem('pdfReaderBooks');
          if (saved) {
            const books = JSON.parse(saved);
            return books[bookId];
          }
        } catch (error) {
          console.error('Error getting saved progress:', error);
        }
        return null;
      };

      // ---- Cloud Sync via GitHub Gist ----
      const GIST_API = 'https://api.github.com/gists';
      const GIST_FILENAME = 'pdf-reader-progress.json';

      // Create a new secret Gist and return its ID
      const createGist = async (token) => {
        try {
          const res = await fetch(GIST_API, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              description: 'PDF Reader sync data',
              public: false,
              files: {
                [GIST_FILENAME]: { content: JSON.stringify({ progress: {} }) }
              }
            })
          });
          if (!res.ok) return null;
          const data = await res.json();
          return data.id || null;
        } catch (e) {
          console.error('Error creating Gist:', e);
          return null;
        }
      };

      // Push progress to the Gist
      const pushProgressToCloud = async (gistId, token, bookId, page, fileName, totalPages) => {
        if (!gistId || !token) return;
        try {
          // Read existing data first
          const getRes = await fetch(`${GIST_API}/${gistId}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
          });
          if (!getRes.ok) { setSyncStatus('error'); return; }
          const getData = await getRes.json();
          const raw = getData.files?.[GIST_FILENAME]?.content || '{"progress":{}}';
          const existing = JSON.parse(raw);
          existing.progress = existing.progress || {};
          existing.progress[bookId] = { page, fileName, totalPages, lastRead: new Date().toISOString() };

          await fetch(`${GIST_API}/${gistId}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              files: { [GIST_FILENAME]: { content: JSON.stringify(existing) } }
            })
          });
          setSyncStatus('synced');
        } catch (e) {
          console.error('Error pushing to Gist:', e);
          setSyncStatus('error');
        }
      };

      // Fetch progress for a book from the Gist
      const fetchCloudProgress = async (gistId, token, bookId) => {
        if (!gistId || !token) return null;
        try {
          const res = await fetch(`${GIST_API}/${gistId}`, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
          });
          if (!res.ok) return null;
          const data = await res.json();
          const raw = data.files?.[GIST_FILENAME]?.content || '{"progress":{}}';
          const parsed = JSON.parse(raw);
          return parsed.progress?.[bookId] || null;
        } catch (e) {
          console.error('Error fetching from Gist:', e);
          return null;
        }
      };

      // Setup sync with a GitHub token — creates a new Gist automatically
      const handleSetupSync = async (token) => {
        const trimmed = token?.trim();
        if (!trimmed) { setSyncStatus('error'); return; }
        setSyncStatus('syncing');
        const gistId = await createGist(trimmed);
        if (!gistId) { setSyncStatus('error'); return; }
        localStorage.setItem('pdfReaderSyncToken', trimmed);
        localStorage.setItem('pdfReaderSyncId', gistId);
        setSyncId(gistId);
        setShowSyncSetup(false);
        setSyncStatus('synced');
      };

      // Connect to an existing Gist on a second device using token + gist ID
      const handleConnectSync = async (token, gistId) => {
        const trimmedToken = token?.trim();
        const trimmedGist = gistId?.trim();
        if (!trimmedToken || !trimmedGist) { setSyncStatus('error'); return false; }
        setSyncStatus('syncing');
        try {
          const res = await fetch(`${GIST_API}/${trimmedGist}`, {
            headers: { 'Authorization': `token ${trimmedToken}`, 'Accept': 'application/vnd.github+json' }
          });
          if (!res.ok) { setSyncStatus('error'); return false; }
          localStorage.setItem('pdfReaderSyncToken', trimmedToken);
          localStorage.setItem('pdfReaderSyncId', trimmedGist);
          setSyncId(trimmedGist);
          setShowSyncSetup(false);
          setSyncStatus('synced');
          return true;
        } catch(e) {
          setSyncStatus('error');
          return false;
        }
      };

      const handleDisconnectSync = () => {
        if (confirm('Disconnect cloud sync? Your local progress will remain.')) {
          localStorage.removeItem('pdfReaderSyncToken');
          localStorage.removeItem('pdfReaderSyncId');
          setSyncId(null);
          setSyncStatus('idle');
        }
      };
      // ---- End Cloud Sync ----

      // Delete a saved book
      const deleteBook = async (bookId, event) => {
        event.stopPropagation();
        
        if (confirm('Delete this book from your library? This will remove the cached file and reading progress.')) {
          await deletePDFFromCache(bookId);
          
          try {
            const saved = localStorage.getItem('pdfReaderBooks');
            if (saved) {
              const books = JSON.parse(saved);
              delete books[bookId];
              localStorage.setItem('pdfReaderBooks', JSON.stringify(books));
              setSavedBooks(books);
            }
          } catch (error) {
            console.error('Error deleting book:', error);
          }
        }
      };

      // Load a saved book from cache
      const loadSavedBook = async (bookId) => {
        setLoading(true);
        try {
          const cachedBook = await getPDFFromCache(bookId);
          if (cachedBook) {
            await loadPDFFromData(cachedBook.fileData, bookId, cachedBook.fileName);
          } else {
            alert('Book not found in cache. Please re-upload the file.');
          }
        } catch (error) {
          console.error('Error loading saved book:', error);
          alert('Error loading book. Please try re-uploading.');
        } finally {
          setLoading(false);
        }
      };

      // Auto-save progress when page changes
      useEffect(() => {
        if (currentBookId && pdfFile && currentPage > 0) {
          const timeoutId = setTimeout(() => {
            const fileName = currentBookId.split('_')[0];
            const fileSize = parseInt(currentBookId.split('_')[1]);
            saveProgress(currentBookId, currentPage, fileName, fileSize, totalPages);
            // Push to cloud if sync is set up
            const currentSyncId = localStorage.getItem('pdfReaderSyncId');
            const currentToken = localStorage.getItem('pdfReaderSyncToken');
            if (currentSyncId && currentToken) {
              setSyncStatus('syncing');
              pushProgressToCloud(currentSyncId, currentToken, currentBookId, currentPage, fileName, totalPages);
            }
          }, 1500);

          return () => clearTimeout(timeoutId);
        }
      }, [currentPage, currentBookId, pdfFile, totalPages]);

      // Calculate available height for content
      useEffect(() => {
        const calculateHeight = () => {
          const vh = window.innerHeight;
          // Adjust based on header state
          // Collapsed: only toggle button (40px) + bottom nav (60px) + bottom button (40px) = 140px
          // Expanded: toggle + top nav (72px) + jump nav (80px) + bottom nav + bottom button = 292px
          const reservedHeight = headerCollapsed ? 140 : 292;
          setPageHeight(vh - reservedHeight);
        };

        calculateHeight();
        window.addEventListener('resize', calculateHeight);
        window.addEventListener('orientationchange', calculateHeight);
        
        return () => {
          window.removeEventListener('resize', calculateHeight);
          window.removeEventListener('orientationchange', calculateHeight);
        };
      }, [headerCollapsed]);

      // Swipe gesture handling with visual feedback
      useEffect(() => {
        const handleTouchStart = (e) => {
          touchStartX.current = e.changedTouches[0].screenX;
          touchStartY.current = e.changedTouches[0].screenY;
          isSwiping.current = false;
        };

        const handleTouchMove = (e) => {
          const currentX = e.changedTouches[0].screenX;
          const currentY = e.changedTouches[0].screenY;
          const diffX = touchStartX.current - currentX;
          const diffY = Math.abs(touchStartY.current - currentY);
          
          // Only consider horizontal swipes (ignore vertical scrolling)
          if (Math.abs(diffX) > 30 && Math.abs(diffX) > diffY * 2) {
            isSwiping.current = true;
            
            // Calculate swipe progress (0 to 1)
            const progress = Math.min(Math.abs(diffX) / 150, 1);
            setSwipeProgress(diffX > 0 ? progress : -progress);
            
            // Prevent scrolling while swiping
            if (progress > 0.1) {
              e.preventDefault();
            }
          }
        };

        const handleTouchEnd = (e) => {
          touchEndX.current = e.changedTouches[0].screenX;
          const swipeDistance = touchStartX.current - touchEndX.current;
          const swipeDistanceY = Math.abs(touchStartY.current - e.changedTouches[0].screenY);
          
          // Reset swipe progress
          setSwipeProgress(0);
          
          // Only trigger page change if:
          // 1. Swipe distance > 100px (increased from 50px)
          // 2. Horizontal swipe is dominant (not vertical scroll)
          // 3. Swipe progress reached at least 60%
          const minSwipeDistance = 100;
          const minProgress = 0.6;
          
          if (isSwiping.current && 
              Math.abs(swipeDistance) > minSwipeDistance && 
              Math.abs(swipeDistance) > swipeDistanceY * 2 &&
              Math.abs(swipeProgress) >= minProgress) {
            
            if (swipeDistance > 0) {
              // Swipe left (next page)
              if (currentPage < totalPages && pdfFile) {
                goToPage(currentPage + 1);
              }
            } else {
              // Swipe right (previous page)
              if (currentPage > 1 && pdfFile) {
                goToPage(currentPage - 1);
              }
            }
          }
          
          isSwiping.current = false;
        };

        const content = contentRef.current;
        if (content) {
          content.addEventListener('touchstart', handleTouchStart);
          content.addEventListener('touchmove', handleTouchMove, { passive: false });
          content.addEventListener('touchend', handleTouchEnd);
          
          return () => {
            content.removeEventListener('touchstart', handleTouchStart);
            content.removeEventListener('touchmove', handleTouchMove);
            content.removeEventListener('touchend', handleTouchEnd);
          };
        }
      }, [currentPage, totalPages, pdfFile, swipeProgress]);

      // Detect chapters
      const detectChapters = async (pdf) => {
        setDetectingChapters(true);
        const detectedChapters = [];
        
        try {
          for (let i = 1; i <= pdf.numPages; i++) {
            const textItems = await extractTextFromPage(pdf, i);
            const fullText = textItems.map(item => item.text).join(' ');
            
            const chapterPatterns = [
              /chapter\s+(\d+|[IVXLCDM]+)/i,
              /capítulo\s+(\d+|[IVXLCDM]+)/i,
              /^(\d+)\.\s+[A-Z]/,
              /^part\s+(\d+|[IVXLCDM]+)/i,
              /^parte\s+(\d+|[IVXLCDM]+)/i,
            ];
            
            for (const pattern of chapterPatterns) {
              const match = fullText.match(pattern);
              if (match) {
                const titleMatch = fullText.match(pattern.source + '[:\\s]*([^\n.]{3,50})');
                const title = titleMatch ? titleMatch[1].trim() : match[0];
                
                detectedChapters.push({
                  page: i,
                  title: title || `Chapter at page ${i}`,
                  fullMatch: match[0]
                });
                break;
              }
            }
          }
          
          setChapters(detectedChapters);
        } catch (error) {
          console.error('Error detecting chapters:', error);
        } finally {
          setDetectingChapters(false);
        }
      };

      // Extract text from PDF page
      const extractTextFromPage = async (pdf, pageNum) => {
        try {
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          
          const textItems = textContent.items.map(item => ({
            text: item.str,
            x: item.transform[4],
            y: item.transform[5],
            width: item.width,
            height: item.height
          }));
          
          return textItems;
        } catch (error) {
          console.error('Error extracting text:', error);
          return [];
        }
      };

      // Load PDF from file data
      const loadPDFFromData = async (fileData, bookId, fileName) => {
        setCurrentBookId(bookId);
        
        const localProgress = getSavedProgress(bookId);
        
        setLoading(true);
        try {
          const pdfjsLib = window['pdfjs-dist/build/pdf'];
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          
          const pdf = await pdfjsLib.getDocument(fileData).promise;
          setPdfFile(pdf);
          setTotalPages(pdf.numPages);
          setCurrentPage(1);
          await loadPage(pdf, 1);
          detectChapters(pdf);

          // Check cloud progress (if sync is set up)
          const currentSyncId = localStorage.getItem('pdfReaderSyncId');
          const currentToken = localStorage.getItem('pdfReaderSyncToken');
          if (currentSyncId && currentToken) {
            setSyncStatus('syncing');
            const cloud = await fetchCloudProgress(currentSyncId, currentToken, bookId);
            setSyncStatus('synced');
            const localPage = localProgress?.currentPage || 1;
            const cloudPage = cloud?.page || 1;
            // Show the highest page we know about, preferring cloud if newer or further
            const cloudNewer = cloud && (!localProgress || new Date(cloud.lastRead) > new Date(localProgress.lastRead));
            const bestPage = cloudNewer ? cloudPage : localPage;
            if (bestPage > 1) {
              setSavedPage(bestPage);
              setCloudProgress(cloud && cloudNewer ? cloud : null);
              setShowContinuePrompt(true);
            }
          } else if (localProgress && localProgress.currentPage > 1) {
            setShowContinuePrompt(true);
            setSavedPage(localProgress.currentPage);
          }
        } catch (error) {
          console.error('Error loading PDF:', error);
          alert('Error loading PDF file');
        } finally {
          setLoading(false);
        }
      };

      // Load PDF when file is selected
      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        
        if (!file) {
          console.error('No file selected');
          return;
        }
        
        console.log('File selected:', file.name, 'Type:', file.type, 'Size:', file.size);
        
        // iOS sometimes doesn't set the MIME type correctly
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
          alert('Please upload a PDF file');
          return;
        }

        // Check file size (100MB limit)
        if (file.size > 100 * 1024 * 1024) {
          alert('PDF file is too large. Please use a file under 100MB.');
          return;
        }

        const bookId = generateBookId(file.name, file.size);
        
        setLoading(true);
        try {
          const fileReader = new FileReader();
          
          fileReader.onerror = (error) => {
            console.error('FileReader error:', error);
            alert('Error reading file. Please try again.');
            setLoading(false);
          };
          
          fileReader.onload = async (e) => {
            try {
              if (!e.target.result) {
                throw new Error('Failed to read file data');
              }
              
              const typedArray = new Uint8Array(e.target.result);
              console.log('File read successfully, size:', typedArray.length);
              
              // Save to cache
              await savePDFToCache(bookId, file.name, typedArray, file.size);
              
              // Load the PDF
              await loadPDFFromData(typedArray, bookId, file.name);
            } catch (err) {
              console.error('Error processing PDF:', err);
              alert('Error loading PDF: ' + err.message);
              setLoading(false);
            }
          };
          
          fileReader.readAsArrayBuffer(file);
        } catch (error) {
          console.error('Error in handleFileUpload:', error);
          alert('Error loading PDF file: ' + error.message);
          setLoading(false);
        }
      };

      // Handle continue reading
      const handleContinueReading = () => {
        if (savedPage && pdfFile) {
          goToPage(savedPage);
        }
        setShowContinuePrompt(false);
      };

      // Handle start from beginning
      const handleStartFromBeginning = () => {
        setShowContinuePrompt(false);
      };

      // Load a specific page
      const loadPage = async (pdf, pageNum) => {
        setLoading(true);
        setTranslation(null);
        try {
          const textItems = await extractTextFromPage(pdf, pageNum);
          setPageText(textItems);
        } catch (error) {
          console.error('Error loading page:', error);
        } finally {
          setLoading(false);
        }
      };

      // Navigate pages
      const goToPage = (pageNum) => {
        if (pageNum >= 1 && pageNum <= totalPages && pdfFile) {
          setCurrentPage(pageNum);
          loadPage(pdfFile, pageNum);
          setJumpToPageInput('');
          setSelectedChapter('');
        }
      };

      // Handle jump to page
      const handleJumpToPage = () => {
        const pageNum = parseInt(jumpToPageInput);
        if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
          goToPage(pageNum);
        } else {
          alert(`Please enter a page number between 1 and ${totalPages}`);
        }
      };

      // Handle jump to chapter
      const handleJumpToChapter = (e) => {
        const pageNum = parseInt(e.target.value);
        if (!isNaN(pageNum)) {
          setSelectedChapter(e.target.value);
          goToPage(pageNum);
        }
      };

      // Handle Enter key
      const handleJumpKeyPress = (e) => {
        if (e.key === 'Enter') {
          handleJumpToPage();
        }
      };

      // Offline dictionary lookups are provided by window.lookupSpanishDictionary()
      // (20,000-word dictionary + irregular verb table + conjugation/plural stripping,
      // defined in the plain <script> block in <head> - see comments there).

      // Lazily load (or return the cached) in-browser translation model.
      // Downloads once, then transformers.js serves it from the browser's
      // Cache Storage - no network needed on subsequent uses.
      const ensureTranslator = async () => {
        if (translatorRef.current) return translatorRef.current;

        // Skip attempting to load entirely on devices that lack WASM SIMD -
        // trying anyway is what caused crashes on older/low-RAM devices.
        if (window.__offlineTranslatorSupported === false) {
          setTranslatorStatus('unsupported');
          throw new Error('unsupported-device');
        }

        setTranslatorStatus('loading');
        try {
          const translator = await window.getOfflineTranslator((data) => {
            // transformers.js emits several event shapes; we only care about
            // per-file download progress to drive a percentage.
            if (data.status === 'progress' && typeof data.progress === 'number') {
              setTranslatorProgress(Math.round(data.progress));
            }
          });
          translatorRef.current = translator;
          setTranslatorStatus('ready');
          setTranslatorProgress(100);
          return translator;
        } catch (error) {
          console.error('Failed to load offline translation model:', error);
          setTranslatorStatus('error');
          throw error;
        }
      };

      // Translate word - strictly uses whichever mode the user has chosen.
      // No automatic switching or silent fallback between AI Model and Dictionary.
      const handleWordClick = async (word, event) => {
        event.stopPropagation();
        
        const cleanWord = word.replace(/[.,;:!?¿¡"'()]/g, '').trim().toLowerCase();
        if (!cleanWord) return;

        const rect = event.target.getBoundingClientRect();

        if (!translationMode) {
          setTranslation({
            word: cleanWord,
            translation: 'Choose a translation mode (AI Model or Dictionary) in settings first.',
            x: rect.left, y: rect.top, width: rect.width, height: rect.height
          });
          setSentenceTranslation(null);
          return;
        }

        if (translationMode === 'dictionary') {
          const offlineTranslation = window.lookupSpanishDictionary(cleanWord);
          setTranslation({
            word: cleanWord,
            translation: offlineTranslation || 'Not in dictionary.',
            x: rect.left, y: rect.top, width: rect.width, height: rect.height
          });
          setSentenceTranslation(null);
          return;
        }

        // translationMode === 'model'
        setTranslation({
          word: cleanWord,
          translation: translatorRef.current ? 'Translating...' : 'Loading AI translator (first time only)…',
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height
        });
        setSentenceTranslation(null);

        try {
          const translator = await ensureTranslator();
          const result = await translator(cleanWord);
          const translatedText = (result && result[0] && result[0].translation_text) || '';

          setTranslation(prev => (prev && prev.word === cleanWord)
            ? { ...prev, translation: translatedText || 'No translation found.' }
            : prev);
        } catch (error) {
          console.log('AI Model translation failed:', error);
          const message = translatorStatus === 'unsupported'
            ? 'AI Model isn\'t supported on this device. Switch to Dictionary mode in settings.'
            : 'AI Model failed to load. Check settings, or switch to Dictionary mode.';
          setTranslation(prev => (prev && prev.word === cleanWord) ? { ...prev, translation: message } : prev);
        }
      };

      // Close translation popup
      const closeTranslation = () => {
        setTranslation(null);
        setSentenceTranslation(null);
      };

      // Extract the sentence containing a given word from the page text
      const extractSentenceContaining = (word) => {
        // Join all text items into one string
        const fullText = pageText.map(item => item.text).join(' ');
        // Split into sentences on . ! ? — keep delimiter attached
        const sentences = fullText.match(/[^.!?¿¡]+[.!?]*/g) || [fullText];
        const lowerWord = word.toLowerCase();
        // Find the sentence containing our word
        const match = sentences.find(s => s.toLowerCase().includes(lowerWord));
        return match ? match.trim() : null;
      };

      // Translate the sentence containing the tapped word. Only available in
      // AI Model mode - the dictionary is word-level only, so this is
      // disabled/hidden in the UI when Dictionary mode is selected.
      const handleTranslateSentence = async () => {
        if (translationMode !== 'model') {
          setSentenceTranslation('Sentence translation requires AI Model mode.');
          return;
        }
        const sentence = extractSentenceContaining(translation.word);
        if (!sentence) { setSentenceTranslation('Could not detect sentence.'); return; }
        setSentenceTranslation('loading');
        try {
          const translator = await ensureTranslator();
          const result = await translator(sentence);
          const translated = (result && result[0] && result[0].translation_text) || '';
          setSentenceTranslation(translated || 'No translation found.');
        } catch (e) {
          console.log('AI Model unavailable for sentence translation:', e);
          setSentenceTranslation('AI Model unavailable on this device.');
        }
      };

      // Handle click on reading area (close translation)
      const handleReadingAreaClick = (e) => {
        // Close translation when clicking anywhere in the reading area
        if (translation) {
          closeTranslation();
        }
      };

      // Format file size
      const formatFileSize = (bytes) => {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      };

      // Toggle dark mode
      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
      };

      // Toggle header collapsed state
      const toggleHeader = () => {
        setHeaderCollapsed(!headerCollapsed);
      };

      return (
        <div className={`h-full flex flex-col overflow-hidden ${darkMode ? 'bg-gray-900' : 'bg-gradient-to-br from-slate-50 to-slate-100'}`}>
          <div className="flex-1 flex flex-col overflow-hidden max-w-4xl mx-auto w-full">
            <div className={`flex-1 flex flex-col shadow-lg overflow-hidden ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
              {/* Header */}
              {!headerCollapsed && (
                <div className={`p-4 flex-shrink-0 ${darkMode ? 'bg-gray-900' : 'bg-gradient-to-r from-blue-600 to-blue-700'}`}>
                  <div className="flex items-center justify-between">
                    <div className="flex-1">
                      <h1 className={`text-2xl font-bold mb-1 ${darkMode ? 'text-gray-100' : 'text-white'}`}>PDF Book Reader</h1>
                      <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-blue-100'}`}>
                        Upload a Spanish PDF and click any word to translate • Swipe to navigate
                      </p>
                    </div>
                    <button
                      onClick={toggleDarkMode}
                      className={`p-3 rounded-lg transition-colors ${
                        darkMode 
                          ? 'bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-yellow-400' 
                          : 'bg-blue-800 hover:bg-blue-900 active:bg-blue-950 text-white'
                      }`}
                      title={darkMode ? "Switch to light mode" : "Switch to dark mode"}
                    >

                    className={`w-full flex items-center justify-between px-4 py-2.5 text-sm transition-colors ${
                      darkMode
                        ? 'text-gray-400 hover:text-gray-300 hover:bg-gray-700 active:bg-gray-600'
                        : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50 active:bg-gray-100'
                    }`}
                  >
                    <span>Translate sentence</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="9 18 15 12 9 6"/>
                    </svg>
                  </button>
                ) : sentenceTranslation === 'loading' ? (
                  // Loading state
                  <div className={`px-4 py-3 flex items-center gap-2 text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                    <div className={`animate-spin rounded-full h-3 w-3 border-b-2 ${darkMode ? 'border-blue-400' : 'border-blue-600'}`}></div>
                    Translating sentence…
                  </div>
                ) : (
                  // Sentence translation result
                  <div className="px-4 py-3">
                    <div className={`text-xs font-medium mb-1 flex items-center justify-between ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                      <span>Sentence</span>
                      <button
                        onClick={() => setSentenceTranslation(null)}
                        className={`text-xs underline ${darkMode ? 'text-gray-600' : 'text-gray-400'}`}
                      >hide</button>
                    </div>
                    <div className={`text-sm leading-relaxed ${darkMode ? 'text-blue-300' : 'text-blue-700'}`}>
                      {sentenceTranslation}
                    </div>
                  </div>
                )}
              </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PDFBookReader />);
  </script>
</body>
</html>
